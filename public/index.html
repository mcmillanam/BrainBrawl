<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Brain Brawl</title>
  <style>
    body{background:#121212;color:#fff;font-family:Arial,Helvetica,sans-serif;margin:0;padding:20px;}
    a{color:#4ea5ff;text-decoration:none;cursor:pointer;}
    nav a{margin-right:15px;}
    h1,h2{color:#fff;}
    input, textarea, select{background:#222;color:#fff;border:1px solid #444;padding:5px;margin:5px 0;width:100%;max-width:400px;}
    button{background:#4ea5ff;color:#fff;border:none;padding:8px 12px;margin-top:10px;cursor:pointer;}
    button:hover{background:#3b8ad9;}
    .section{display:none;}
    .active{display:block;}
    .msg{margin-top:10px;color:#4ea5ff;}
  </style>
</head>
<body>
  <h1>Brain Brawl</h1>
  <nav>
    <a id="nav-home">Home</a>
    <a id="nav-quizzes">Quizzes</a>
    <a id="nav-trivia">Trivia</a>
    <a id="nav-login">Login / Sign‑up</a>
    <a id="nav-create">Create</a>
  </nav>
  <div id="home" class="section active">
    <p>Welcome! Choose a section from the navigation above.</p>
  </div>
  <div id="quizzes" class="section"></div>
  <div id="trivia" class="section"></div>
  <div id="login" class="section"></div>
  <div id="create" class="section"></div>
  <div class="msg" id="msg"></div>

  <script>
    const sections = {home:'home', quizzes:'quizzes', trivia:'trivia', login:'login', create:'create'};
    function show(sec){
      Object.values(sections).forEach(id=>document.getElementById(id).classList.remove('active'));
      document.getElementById(sec).classList.add('active');
      document.getElementById('msg').textContent='';
    }
    document.getElementById('nav-home').onclick=()=>show('home');
    document.getElementById('nav-quizzes').onclick=()=>{show('quizzes'); loadQuizzes();};
    document.getElementById('nav-trivia').onclick=()=>{show('trivia'); loadTrivia();};
    document.getElementById('nav-login').onclick=()=>{show('login'); renderLogin();};
    document.getElementById('nav-create').onclick=()=>{show('create'); renderCreate();};

    async function loadQuizzes(){
      const res=await fetch('/quizzes');
      const data = await res.json();
      if (!data.length) {
	      document.getElementById('quizzes').innerHTML = "<p>No quizzes yet.</p>";
	      return;
      }
      let html = "<h2>Available Quizzes</h2><ul>";
      for (const quiz of data) {
	      html += `<li>
		      <strong>${quiz.title}</strong>
		      <button onclick="playQuiz('${quiz.quizId}')">Play</button>
	      </li>`;
      }
      html += "</ul>";
      document.getElementById('quizzes').innerHTML = html;
    }
    async function playQuiz(id) {
	    const res = await fetch(`/quiz/${id}`);
	    const quiz = await res.json();
	    let html = `<h2>${quiz.title}</h2>`;
	    quiz.questions.forEach((q, i) => {
		    html += `<p>${i + 1}. ${q.text}</p>`;
		    q.choices.forEach((c, idx) => {
			    html += `<label>
				    <input type="radio" name="q${i}" value="${idx}">
				    ${c}
				    </label><br>`;
		    });
	    });
	    html += `<button onclick="submitQuiz('${quiz.quizId}')">Submit</button>`;
	    document.getElementById('quizzes').innerHTML = html;
    }
    async function submitQuiz(quizId) {
	    const answers = [];
	    const quizRes = await fetch(`/quiz/${quizId}`);
	    const quiz = await quizRes.json();
	    for (let i = 0; i < quiz.questions.length; i++) {
		    const selected = document.querySelector(`input[name="q${i}"]:checked`);
		    answers.push(selected ? parseInt(selected.value, 10) : null);
	    }
	    const res = await fetch(`/quiz/${quizId}/submit`, {
		    method: "POST",
		    headers: { "Content-Type": "application/json" },
		    body: JSON.stringify({
			    userId: "test-user",
			    answers
		    })
	    });
	    const data = await res.json();
	    document.getElementById("msg").innerHTML = `Score: ${data.score}`;
    }
    async function loadTrivia(){
      const res=await fetch('/trivia');
      const txt=await res.text();
      document.getElementById('trivia').innerHTML=txt;
    }

    function renderLogin(){
      const html=`<h2>Login / Sign‑up</h2>
        <form id="loginForm">
          <label>Username: <input type="text" name="username" required></label><br>
          <label>Password: <input type="password" name="password" required></label><br>
          <button type="submit" name="action" value="login">Login</button>
          <button type="submit" name="action" value="signup">Sign‑up</button>
        </form>`;
      document.getElementById('login').innerHTML=html;
      document.getElementById('loginForm').onsubmit=async e=>{
        e.preventDefault();
        const form=new FormData(e.target);
        const data=new URLSearchParams();
        for(const [k,v] of form.entries()) data.append(k,v);
	const action = e.submitter.value;
	const endpoint = action === "signup" ? "/signup" : "/login";
        const res=await fetch(endpoint, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:data});
        const txt=await res.text();
        document.getElementById('msg').innerHTML=txt;
      };
    }

  </script>
</body>
</html>
